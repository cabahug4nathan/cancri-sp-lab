async function testCDP() {
  const url = "http://localhost:9222/json/version";

  try {
    const r = await fetch(url);
    const body = await r.text();

    log("cdp_test", {
      status: r.status,
      body: body
    });
  } catch (e) {
    log("cdp_test_error", {
      message: e.message,
      stack: e.stack,
      url: url
    });
  }
}

testCDP();
